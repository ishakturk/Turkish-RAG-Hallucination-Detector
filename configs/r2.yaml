# R2: mmBERT-base (multilingual, 307M) with our recipe: cleaned data, class-weighted CE, lr 3e-5,
# up to 4 epochs, evaluation every half epoch, early stopping on validation word F1.
name: r2_mmbert
model_id: jhu-clsp/mmBERT-base
lr: 3.0e-5
epochs: 4
batch_size: 4
grad_accum: 4
loss: weighted_ce
evals_per_epoch: 2
early_stopping_patience: 2
save_checkpoints: true
select_metric: word_f1
extra: {train_split: train_clean, val_split: validation_clean, augment: false, params_m: 307}
